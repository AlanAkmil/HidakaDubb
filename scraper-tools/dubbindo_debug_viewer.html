<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HidakaDubb — Debug Viewer</title>
<style>
  :root {
    --bg: #14111F; --panel: #1E1830; --panel2: #251E3B;
    --rec: #FF5A3C; --amber: #F4B942; --paper: #F5F1E8; --muted: #A79FC0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--paper);
    font-family: -apple-system, "Segoe UI", Inter, sans-serif;
    padding: 24px 16px 60px;
  }
  header { max-width: 900px; margin: 0 auto 28px; }
  .logo { font-weight: 700; font-size: 20px; letter-spacing: -0.02em; }
  .logo span { color: var(--rec); }
  .rec-dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 999px;
    background: var(--rec); margin-right: 8px; animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse { 50% { opacity: 0.4; } }
  .meta { color: var(--muted); font-size: 13px; margin-top: 6px; font-family: monospace; }
  main { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
  section {
    background: var(--panel); border: 1px solid rgba(255,255,255,0.06);
    border-radius: 14px; padding: 18px 20px; overflow: hidden;
  }
  h2 {
    font-size: 13px; text-transform: uppercase; letter-spacing: 0.15em;
    color: var(--amber); margin: 0 0 14px; font-family: monospace;
  }
  .video-card {
    display: flex; gap: 14px; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .video-card:last-child { border-bottom: none; }
  .video-card .idx { color: var(--muted); font-family: monospace; font-size: 12px; width: 22px; flex-shrink: 0; padding-top: 2px; }
  .video-card .title { font-weight: 600; font-size: 14.5px; }
  .video-card a { color: var(--paper); text-decoration: none; }
  .video-card a:hover { color: var(--rec); }
  .video-card .sub { color: var(--muted); font-size: 12px; margin-top: 4px; font-family: monospace; }
  .kv { display: grid; grid-template-columns: 140px 1fr; gap: 8px 14px; font-size: 13.5px; }
  .kv dt { color: var(--muted); font-family: monospace; font-size: 12px; }
  .kv dd { margin: 0; word-break: break-all; }
  .kv a { color: var(--rec); }
  .pill {
    display: inline-block; background: var(--panel2); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 999px; padding: 3px 10px; font-size: 11px; font-family: monospace; color: var(--muted);
    margin: 2px 4px 0 0;
  }
  .note {
    background: rgba(244,185,66,0.08); border: 1px solid rgba(244,185,66,0.25);
    color: var(--amber); border-radius: 10px; padding: 12px 14px; font-size: 13px; line-height: 1.5;
  }
  .raw {
    background: #0e0c17; border-radius: 10px; padding: 14px; font-family: monospace;
    font-size: 12px; line-height: 1.6; overflow-x: auto; color: #d8d2eb; white-space: pre-wrap;
    word-break: break-word;
  }
  .toggle {
    cursor: pointer; color: var(--muted); font-family: monospace; font-size: 12px;
    background: none; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px;
    padding: 6px 10px; margin-top: 10px;
  }
  .toggle:hover { color: var(--paper); border-color: rgba(255,255,255,0.25); }
  .synopsis { font-size: 13.5px; color: var(--paper); line-height: 1.6; margin-top: 4px; }
</style>
</head>
<body>
<header>
  <div class="logo"><span class="rec-dot"></span>Hidaka<span>Dubb</span> — Debug Viewer</div>
  <div class="meta" id="scraped-meta">memuat...</div>
</header>

<main id="app">
  <section class="note">
    Memuat <code>dubbindo_debug.json</code>... Kalau file ini dibuka langsung dari
    <code>file://</code> dan datanya gak muncul, taruh <code>dubbindo_debug.json</code> di folder
    yang sama dengan file HTML ini, atau buka lewat local server kecil
    (<code>python -m http.server</code>).
  </section>
</main>

<script>
async function load() {
  const app = document.getElementById("app");
  let data;
  try {
    const res = await fetch("dubbindo_debug.json");
    if (!res.ok) throw new Error("HTTP " + res.status);
    data = await res.json();
  } catch (err) {
    app.innerHTML = `<section class="note">Gagal load JSON: ${err.message}. Pastikan dubbindo_debug.json ada di folder yang sama.</section>`;
    return;
  }

  document.getElementById("scraped-meta").textContent =
    `scraped_at: ${data.scraped_at}  ·  source: ${data.source}`;

  const d = data.video_detail_sample;
  const cat = data.category_listing_sample;

  app.innerHTML = `
    <section class="note">${data.note}</section>

    <section>
      <h2>Video Detail Sample</h2>
      <dl class="kv">
        <dt>title</dt><dd>${d.title}</dd>
        <dt>url</dt><dd><a href="${d.url}" target="_blank" rel="noopener">${d.url}</a></dd>
        <dt>video_src</dt><dd><a href="${d.video_src}" target="_blank" rel="noopener">${d.video_src}</a></dd>
        <dt>download_link</dt><dd><a href="${d.download_link}" target="_blank" rel="noopener">${d.download_link}</a></dd>
        <dt>embed_url</dt><dd><a href="${d.embed_url}" target="_blank" rel="noopener">${d.embed_url}</a></dd>
        <dt>category</dt><dd>${d.category} / ${d.subcategory}</dd>
        <dt>views</dt><dd>${d.views}</dd>
        <dt>likes / dislikes</dt><dd>${d.likes} / ${d.dislikes}</dd>
        <dt>comments</dt><dd>${d.comment_count}</dd>
        <dt>uploaded</dt><dd>${d.upload_date}</dd>
        <dt>uploader</dt><dd><a href="${d.uploader.url}" target="_blank" rel="noopener">${d.uploader.name}</a> — ${d.uploader.subscribers} subs</dd>
      </dl>
      <div class="synopsis">${d.synopsis}</div>
      <div style="margin-top:10px">${d.tags_meta.map(t => `<span class="pill">${t}</span>`).join("")}</div>
    </section>

    <section>
      <h2>Category Listing Sample — ${cat.category} (id ${cat.category_id}, ${cat.total_pages} halaman)</h2>
      ${cat.videos.map((v, i) => `
        <div class="video-card">
          <div class="idx">${String(i + 1).padStart(2, "0")}</div>
          <div>
            <div class="title"><a href="${v.url}" target="_blank" rel="noopener">${v.title}</a></div>
            <div class="sub">${v.duration} · ${v.uploader} · ${v.views} views · ${v.uploaded}</div>
          </div>
        </div>
      `).join("")}
    </section>

    <section>
      <h2>URL Patterns Confirmed</h2>
      <dl class="kv">
        ${Object.entries(data.url_patterns_confirmed).map(([k, v]) =>
          `<dt>${k}</dt><dd>${Array.isArray(v) ? v.join(", ") : v}</dd>`
        ).join("")}
      </dl>
    </section>

    <section>
      <h2>Notes</h2>
      ${Object.entries(data.notes).map(([k, v]) =>
        `<div style="margin-bottom:10px"><strong style="color:var(--amber)">${k}:</strong> <span class="synopsis">${v}</span></div>`
      ).join("")}
    </section>

    <section>
      <h2>Raw JSON</h2>
      <button class="toggle" onclick="const r=document.getElementById('raw'); r.style.display = r.style.display==='none' ? 'block' : 'none';">Tampilkan / sembunyikan raw JSON</button>
      <div id="raw" class="raw" style="display:none; margin-top:10px">${JSON.stringify(data, null, 2)}</div>
    </section>
  `;
}
load();
</script>
</body>
</html>
